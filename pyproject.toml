[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI's Depends() pattern
    "B904",  # raise-from chaining not required for HTTPExceptions
    "B905",  # zip() without strict — codebase-wide style choice
    "E741",  # ambiguous variable names tolerated
    "UP037", # quoted annotation false positives in dataclass-like contexts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
